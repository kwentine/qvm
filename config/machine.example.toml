# Machine configuration for qvm-run: ~/.config/qvm/machines/VM.toml
# All settings are optional. See also: qvm-run --help

[qvm]
# Shorthands, expanded by qvm-run.
# Each is also a command line option (--cpus...), which wins.
cpus = 4                 # -smp
memory = "4G"            # -m (default: 8G)
# ISO in QVM_DATA_DIR/iso, or a path
cdrom = "rhel-10.0-x86_64-dvd"
# If unspecified, a MAC address is derived from the VM name
mac = "52:54:00:12:34:56"
# Extra disks, after the boot disk: /dev/vdb, /dev/vdc...
# Paths (relative to the current directory, ~ expanded). Not *.qcow2 means raw.
disks = ["~/.local/share/qvm/machines/node-data.raw", "~/images/scratch.qcow2"]

[qemu]
# QEMU command line options, passed as they are. TOML keys are unique, hence:
#   key = "value"          -key value
#   key = ["v1", "v2"]     -key v1 -key v2    (an option given several times)
#   key = true             -key               (a flag)
#   key = false            drops the option qvm-run would pass
# An option qvm-run also passes is replaced: [qemu] wins over [qvm] and the command line.
# qvm-run passes: -name -smp -m -cdrom -accel kvm -cpu host -serial mon:pty -display none

# Replaces '-display none': display video output in a GTK window
display = "gtk"
# Replaces cpus above (qvm-run says so)
# smp = "cpus=4,sockets=1,cores=2,threads=2"
# A disk with all its options, plus a random number generator: -device twice
blockdev = "driver=file,node-name=extra,filename=/path/to/disk.img"
device = ["virtio-blk-pci,drive=extra", "virtio-rng-pci"]
# Flag: exit instead of rebooting (handy for installs)
no-reboot = true
